name: Feature request
description: A backup-vault behavior Harbor does not have yet
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to back up, and what blocks you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How the panel, API, or CLI should behave.
    validations:
      required: true
