name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
      - name: Test
        working-directory: apps/server
        run: go test ./...

  panel:
    name: Panel typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Install and typecheck
        working-directory: apps/panel
        run: npm ci && npx tsc -b --pretty false
