name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
      - name: Test
        working-directory: apps/server
        run: go test ./...

  panel:
    name: Panel typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Install and typecheck
        working-directory: apps/panel
        run: npm ci && npx tsc -b --pretty false

  release:
    name: Release and Docker image
    needs: [server, panel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/should_release.py
      - name: Check the server version matches VERSION.md
        if: steps.version.outputs.publish == 'true'
        run: grep -q "var Version = \"${{ steps.version.outputs.version }}\"" apps/server/internal/config/config.go
      - uses: actions/setup-go@v7
        if: steps.version.outputs.publish == 'true'
        with:
          go-version-file: apps/server/go.mod
      - uses: actions/setup-node@v7
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Build the panel into the release binaries
        if: steps.version.outputs.publish == 'true'
        working-directory: apps/panel
        run: |
          npm ci
          npm run build
          rm -rf ../server/internal/panel/dist
          mkdir -p ../server/internal/panel/dist
          cp -a dist/. ../server/internal/panel/dist/
      - name: Build release binaries
        if: steps.version.outputs.publish == 'true'
        working-directory: apps/server
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          while read -r goos goarch name extra; do
            goos=${goos//$'\r'/}
            goarch=${goarch//$'\r'/}
            name=${name//$'\r'/}
            extra=${extra//$'\r'/}
            [ -z "$goos" ] && continue
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -ldflags "-s -w -X harbor/internal/config.Version=${VERSION} ${extra}" \
              -o "dist/${name}" ./cmd/harbor
          done <<'EOF'
          linux amd64 harbor-linux-amd64
          linux arm64 harbor-linux-arm64
          darwin amd64 harbor-darwin-amd64
          darwin arm64 harbor-darwin-arm64
          windows amd64 harbor-windows-amd64.exe -H=windowsgui
          EOF
          cd dist
          sha256sum * > SHA256SUMS
      - name: Image names
        if: steps.version.outputs.publish == 'true'
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/harbor" >> "$GITHUB_OUTPUT"
          echo "dockerhub=foisalislambd/harbor" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: steps.version.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.version.outputs.publish == 'true'
      - uses: docker/login-action@v4
        if: steps.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: steps.version.outputs.publish == 'true'
        with:
          username: foisalislambd
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.version.outputs.publish == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.dockerhub }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.dockerhub }}:latest
      - name: Release notes
        if: steps.version.outputs.publish == 'true'
        run: python .github/scripts/release_notes.py
      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md apps/server/dist/*
      - name: Mark the container package public
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT -H "Accept: application/vnd.github+json" /user/packages/container/harbor -f visibility=public \
            || gh api --method PUT -H "Accept: application/vnd.github+json" "/orgs/${{ github.repository_owner }}/packages/container/harbor" -f visibility=public \
            || echo "Package pushed. Set it to public in GitHub Packages if this step could not."
