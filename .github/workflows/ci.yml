name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
      - name: Vet and format
        working-directory: apps/server
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Test
        working-directory: apps/server
        run: go test ./...
      - name: Vulnerability scan
        working-directory: apps/server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  panel:
    name: Panel typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Install and typecheck
        working-directory: apps/panel
        run: npm ci && npx tsc -b --pretty false && npm run lint && node --experimental-strip-types --test src/lib/api-error.test.ts && npm audit --omit=dev

  release:
    name: Release and Docker image
    needs: [server, panel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/should_release.py
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.version.outputs.publish == 'true'
        with:
          go-version: '1.26.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Build the panel into the release binaries
        if: steps.version.outputs.publish == 'true'
        working-directory: apps/panel
        run: |
          npm ci
          npm run build
          rm -rf ../server/internal/panel/dist
          mkdir -p ../server/internal/panel/dist
          cp -a dist/. ../server/internal/panel/dist/
      - name: Build release binaries
        if: steps.version.outputs.publish == 'true'
        working-directory: apps/server
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          while read -r goos goarch name extra; do
            goos=${goos//$'\r'/}
            goarch=${goarch//$'\r'/}
            name=${name//$'\r'/}
            extra=${extra//$'\r'/}
            [ -z "$goos" ] && continue
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -ldflags "-s -w -X harbor/internal/config.Version=${VERSION} ${extra}" \
              -o "dist/${name}" ./cmd/harbor
          done <<'EOF'
          linux amd64 harbor-linux-amd64
          linux arm64 harbor-linux-arm64
          darwin amd64 harbor-darwin-amd64
          darwin arm64 harbor-darwin-arm64
          windows amd64 harbor-windows-amd64.exe -H=windowsgui
          EOF
          cd dist
          sha256sum * > SHA256SUMS
      - name: Image names
        if: steps.version.outputs.publish == 'true'
        id: image
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/harbor" >> "$GITHUB_OUTPUT"
          echo "dockerhub=foisalislambd/harbor" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.version.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.version.outputs.publish == 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.version.outputs.publish == 'true'
        with:
          username: foisalislambd
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.version.outputs.publish == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.dockerhub }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.dockerhub }}:latest
      - name: Release notes
        if: steps.version.outputs.publish == 'true'
        run: python .github/scripts/release_notes.py
      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md apps/server/dist/*
      - name: Mark the container package public
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          gh api --method PUT -H "Accept: application/vnd.github+json" /user/packages/container/harbor -f visibility=public \
            || gh api --method PUT -H "Accept: application/vnd.github+json" "/orgs/${REPO_OWNER}/packages/container/harbor" -f visibility=public \
            || echo "Package pushed. Set it to public in GitHub Packages if this step could not."
