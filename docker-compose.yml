services:
  harbor:
    # Local build. To run a published release instead, set image to
    # ghcr.io/foisalislambd/harbor:<version from VERSION.md> or
    # foisalislambd/harbor:<version from VERSION.md> and remove build.
    build: .
    ports:
      - "8787:8787"
    environment:
      HARBOR_ADDR: ":8787"
      HARBOR_DATA_DIR: /data
    volumes:
      - harbor-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  harbor-data:
