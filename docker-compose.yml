services:
  harbor:
    # Local build. To run a published release instead, set image to
    # ghcr.io/OWNER/harbor:<version from VERSION.md> and remove build.
    build: .
    ports:
      - "8787:8787"
    environment:
      HARBOR_ADDR: ":8787"
      HARBOR_DATA_DIR: /data
      HARBOR_PANEL_DIR: /panel
    volumes:
      - harbor-data:/data
    restart: unless-stopped

volumes:
  harbor-data:
